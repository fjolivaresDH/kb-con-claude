<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480">
  <rect x="0" y="0" width="920" height="480" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1a2a3a">Qué poner en cada campo de una tarea programada</text>
  <text x="460" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#8a94a0">Diagrama ilustrativo (no es una captura de pantalla)</text>

  <!-- formulario -->
  <rect x="30" y="72" width="420" height="378" rx="10" fill="#fbfcfd" stroke="#c3d0dd" stroke-width="1.5"/>

  <text x="48" y="98" font-family="Arial" font-size="13" font-weight="bold" fill="#33475b">Nombre</text>
  <rect x="48" y="106" width="384" height="30" rx="5" fill="#ffffff" stroke="#d5dee7"/>
  <text x="58" y="126" font-family="Courier New" font-size="12" fill="#5a6a7d">vencimientos-6-meses</text>

  <text x="48" y="162" font-family="Arial" font-size="13" font-weight="bold" fill="#33475b">Descripción</text>
  <rect x="48" y="170" width="384" height="30" rx="5" fill="#ffffff" stroke="#d5dee7"/>
  <text x="58" y="190" font-family="Courier New" font-size="12" fill="#5a6a7d">Aviso mensual de contratos por vencer</text>

  <text x="48" y="226" font-family="Arial" font-size="13" font-weight="bold" fill="#33475b">La instrucción (qué debe hacer)</text>
  <rect x="48" y="234" width="384" height="86" rx="5" fill="#ffffff" stroke="#d5dee7"/>
  <text x="58" y="254" font-family="Courier New" font-size="11.5" fill="#5a6a7d">Revisa _data/contratos.json y dime qué</text>
  <text x="58" y="272" font-family="Courier New" font-size="11.5" fill="#5a6a7d">vence en los próximos 6 meses, ordenado</text>
  <text x="58" y="290" font-family="Courier New" font-size="11.5" fill="#5a6a7d">por fecha. Avisa de los preavisos a punto</text>
  <text x="58" y="308" font-family="Courier New" font-size="11.5" fill="#5a6a7d">de cumplirse.</text>

  <rect x="48" y="336" width="230" height="28" rx="5" fill="#eef4fb" stroke="#9bb0c4"/>
  <text x="60" y="355" font-family="Arial" font-size="12" fill="#254a72">Trabajar en un proyecto ▾</text>
  <rect x="290" y="336" width="142" height="28" rx="5" fill="#f4f7fa" stroke="#d5dee7"/>
  <text x="300" y="355" font-family="Arial" font-size="12" fill="#5a6a7d">Modelo ▾</text>

  <rect x="48" y="374" width="384" height="28" rx="5" fill="#f4f7fa" stroke="#d5dee7"/>
  <text x="58" y="393" font-family="Courier New" font-size="10.5" fill="#5a6a7d">...\Cowork\MiConocimiento</text>
  <text x="424" y="393" text-anchor="end" font-family="Arial" font-size="10" fill="#8a94a0">del proyecto</text>

  <text x="48" y="432" font-family="Arial" font-size="13" font-weight="bold" fill="#33475b">Frecuencia</text>
  <rect x="130" y="414" width="130" height="28" rx="5" fill="#fff5e8" stroke="#e08a2b" stroke-width="1.5"/>
  <text x="142" y="433" font-family="Arial" font-size="12" font-weight="bold" fill="#7a4a10">Mensual ▾</text>

  <!-- callouts -->
  <path d="M 434 121 L 476 121" stroke="#9bb0c4" stroke-width="2"/>
  <rect x="476" y="98" width="416" height="46" rx="7" fill="#ffffff" stroke="#9bb0c4" stroke-width="1.5"/>
  <text x="490" y="118" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a2a3a">Nombre corto, sin espacios</text>
  <text x="490" y="135" font-family="Arial" font-size="12" fill="#33475b">Es la etiqueta con la que verás la tarea en la lista.</text>

  <path d="M 434 185 L 476 185" stroke="#9bb0c4" stroke-width="2"/>
  <rect x="476" y="162" width="416" height="46" rx="7" fill="#ffffff" stroke="#9bb0c4" stroke-width="1.5"/>
  <text x="490" y="182" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a2a3a">Una línea explicando para qué es</text>
  <text x="490" y="199" font-family="Arial" font-size="12" fill="#33475b">Para tu yo del futuro, cuando tengas varias tareas.</text>

  <path d="M 434 277 L 476 277" stroke="#178a6e" stroke-width="2"/>
  <rect x="476" y="240" width="416" height="76" rx="7" fill="#e7f7f1" stroke="#178a6e" stroke-width="1.5"/>
  <text x="490" y="260" font-family="Arial" font-size="12.5" font-weight="bold" fill="#0f5e4b">Aquí va el trabajo de verdad</text>
  <text x="490" y="278" font-family="Arial" font-size="12" fill="#1a4a3d">Escríbelo como si se lo pidieras en el chat. Di qué</text>
  <text x="490" y="294" font-family="Arial" font-size="12" fill="#1a4a3d">archivo mirar y qué esperas de vuelta. Añade &#171;si no</text>
  <text x="490" y="310" font-family="Arial" font-size="12" fill="#1a4a3d">hay nada, no hagas nada&#187; para evitar ruido.</text>

  <path d="M 434 388 L 476 388" stroke="#3b7dd8" stroke-width="2"/>
  <rect x="476" y="332" width="416" height="62" rx="7" fill="#eef4fb" stroke="#3b7dd8" stroke-width="1.5"/>
  <text x="490" y="352" font-family="Arial" font-size="12.5" font-weight="bold" fill="#254a72">Elige tu proyecto</text>
  <text x="490" y="370" font-family="Arial" font-size="12" fill="#33475b">Al seleccionarlo, la tarea trabaja sobre la carpeta del</text>
  <text x="490" y="386" font-family="Arial" font-size="12" fill="#33475b">proyecto y hereda sus Instrucciones. Es lo que quieres.</text>

  <path d="M 264 428 L 476 428" stroke="#e08a2b" stroke-width="2"/>
  <rect x="476" y="410" width="416" height="46" rx="7" fill="#fff5e8" stroke="#e08a2b" stroke-width="1.5"/>
  <text x="490" y="430" font-family="Arial" font-size="12.5" font-weight="bold" fill="#7a4a10">Cámbialo: viene en «Manual»</text>
  <text x="490" y="447" font-family="Arial" font-size="12" fill="#5c3c0e">Si lo dejas en Manual, no se ejecuta solo nunca.</text>
</svg>
