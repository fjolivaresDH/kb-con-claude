<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1a2a3a">De carpeta vacía a base de conocimiento — 6 pasos</text>
  <text x="480" y="52" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#8a94a0">Diagrama ilustrativo (no es una captura de pantalla)</text>

  <!-- FILA 1 -->
  <rect x="30" y="80" width="270" height="110" rx="10" fill="#eef4fb" stroke="#3b7dd8" stroke-width="2"/>
  <circle cx="60" cy="108" r="15" fill="#3b7dd8"/>
  <text x="60" y="114" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="86" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#1a2a3a">Crear carpeta vacía</text>
  <text x="50" y="145" font-family="Arial" font-size="13" fill="#33475b">En tu equipo, con el nombre</text>
  <text x="50" y="164" font-family="Arial" font-size="13" fill="#33475b">que quieras. Sin nada dentro:</text>
  <text x="50" y="183" font-family="Arial" font-size="13" fill="#33475b">Claude crea la estructura.</text>

  <path d="M300 135 L340 135" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="340,128 356,135 340,142" fill="#9bb0c4"/>

  <rect x="356" y="80" width="270" height="110" rx="10" fill="#fff5e8" stroke="#e08a2b" stroke-width="2"/>
  <circle cx="386" cy="108" r="15" fill="#e08a2b"/>
  <text x="386" y="114" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="412" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#7a4a10">¿En la nube? (opcional)</text>
  <text x="376" y="145" font-family="Arial" font-size="13" fill="#5c3c0e">Si usas OneDrive, Drive o</text>
  <text x="376" y="164" font-family="Arial" font-size="13" fill="#5c3c0e">Dropbox, que esté siempre</text>
  <text x="376" y="183" font-family="Arial" font-size="13" font-weight="bold" fill="#5c3c0e">descargada en el equipo</text>

  <path d="M626 135 L666 135" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="666,128 682,135 666,142" fill="#9bb0c4"/>

  <rect x="682" y="80" width="248" height="110" rx="10" fill="#eef4fb" stroke="#3b7dd8" stroke-width="2"/>
  <circle cx="712" cy="108" r="15" fill="#3b7dd8"/>
  <text x="712" y="114" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="738" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#1a2a3a">Añadir el Contexto</text>
  <text x="702" y="145" font-family="Arial" font-size="13" fill="#33475b">En el proyecto de Cowork,</text>
  <text x="702" y="164" font-family="Arial" font-size="13" fill="#33475b">apartado <tspan font-weight="bold">Contexto</tspan>, añade la</text>
  <text x="702" y="183" font-family="Arial" font-size="13" fill="#33475b">carpeta. Solo la primera vez.</text>

  <!-- bajada -->
  <path d="M806 190 L806 220 L154 220 L154 248" fill="none" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="147,248 154,264 161,248" fill="#9bb0c4"/>

  <!-- FILA 2 -->
  <rect x="30" y="264" width="270" height="110" rx="10" fill="#e7f7f1" stroke="#178a6e" stroke-width="2"/>
  <circle cx="60" cy="292" r="15" fill="#178a6e"/>
  <text x="60" y="298" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="86" y="298" font-family="Arial" font-size="15" font-weight="bold" fill="#0f5e4b">Pegar el prompt</text>
  <text x="50" y="329" font-family="Arial" font-size="13" fill="#1a4a3d">Pon tu [ORGANIZACIÓN], pega el</text>
  <text x="50" y="348" font-family="Arial" font-size="13" fill="#1a4a3d">bloque y elige qué vas a</text>
  <text x="50" y="367" font-family="Arial" font-size="13" fill="#1a4a3d">guardar: crea solo eso.</text>

  <path d="M300 319 L340 319" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="340,312 356,319 340,326" fill="#9bb0c4"/>

  <rect x="356" y="264" width="270" height="110" rx="10" fill="#f3eefb" stroke="#7a4bc0" stroke-width="2"/>
  <circle cx="386" cy="292" r="15" fill="#7a4bc0"/>
  <text x="386" y="298" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="412" y="298" font-family="Arial" font-size="15" font-weight="bold" fill="#4e2a86">Pegar en Instrucciones</text>
  <text x="376" y="329" font-family="Arial" font-size="13" fill="#40305a">Claude te dará un texto con</text>
  <text x="376" y="348" font-family="Arial" font-size="13" fill="#40305a">las reglas: pégalo en el</text>
  <text x="376" y="367" font-family="Arial" font-size="13" fill="#40305a">apartado <tspan font-weight="bold">Instrucciones</tspan>.</text>

  <path d="M626 319 L666 319" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="666,312 682,319 666,326" fill="#9bb0c4"/>

  <rect x="682" y="264" width="248" height="110" rx="10" fill="#e7f7f1" stroke="#178a6e" stroke-width="2"/>
  <circle cx="712" cy="292" r="15" fill="#178a6e"/>
  <text x="712" y="298" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">6</text>
  <text x="738" y="298" font-family="Arial" font-size="15" font-weight="bold" fill="#0f5e4b">Contarle cosas</text>
  <text x="702" y="329" font-family="Arial" font-size="13" fill="#1a4a3d">Datos, correos, capturas,</text>
  <text x="702" y="348" font-family="Arial" font-size="13" fill="#1a4a3d">documentos… él los archiva.</text>
  <text x="702" y="367" font-family="Arial" font-size="13" font-weight="bold" fill="#1a4a3d">Ya está en marcha.</text>

  <text x="480" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7a8d">Los pasos 1 a 3 se hacen una sola vez. El 6 es el día a día.</text>
</svg>
