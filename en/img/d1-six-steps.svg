<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1a2a3a">From empty folder to knowledge base — 6 steps</text>
  <text x="480" y="52" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#8a94a0">Illustrative diagram (not a screenshot)</text>

  <!-- ROW 1 -->
  <rect x="30" y="80" width="270" height="110" rx="10" fill="#eef4fb" stroke="#3b7dd8" stroke-width="2"/>
  <circle cx="60" cy="108" r="15" fill="#3b7dd8"/>
  <text x="60" y="114" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="86" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#1a2a3a">Create an empty folder</text>
  <text x="50" y="145" font-family="Arial" font-size="13" fill="#33475b">On your computer, with any name</text>
  <text x="50" y="164" font-family="Arial" font-size="13" fill="#33475b">you like. Nothing inside:</text>
  <text x="50" y="183" font-family="Arial" font-size="13" fill="#33475b">Claude creates the structure.</text>

  <path d="M300 135 L340 135" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="340,128 356,135 340,142" fill="#9bb0c4"/>

  <rect x="356" y="80" width="270" height="110" rx="10" fill="#fff5e8" stroke="#e08a2b" stroke-width="2"/>
  <circle cx="386" cy="108" r="15" fill="#e08a2b"/>
  <text x="386" y="114" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="412" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#7a4a10">In the cloud? (optional)</text>
  <text x="376" y="145" font-family="Arial" font-size="13" fill="#5c3c0e">If you use OneDrive, Drive or</text>
  <text x="376" y="164" font-family="Arial" font-size="13" fill="#5c3c0e">Dropbox, keep it always</text>
  <text x="376" y="183" font-family="Arial" font-size="13" font-weight="bold" fill="#5c3c0e">downloaded on the computer</text>

  <path d="M626 135 L666 135" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="666,128 682,135 666,142" fill="#9bb0c4"/>

  <rect x="682" y="80" width="248" height="110" rx="10" fill="#eef4fb" stroke="#3b7dd8" stroke-width="2"/>
  <circle cx="712" cy="108" r="15" fill="#3b7dd8"/>
  <text x="712" y="114" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="738" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#1a2a3a">Add the Context</text>
  <text x="702" y="145" font-family="Arial" font-size="13" fill="#33475b">In the Cowork project, under</text>
  <text x="702" y="164" font-family="Arial" font-size="13" fill="#33475b"><tspan font-weight="bold">Context</tspan>, add the</text>
  <text x="702" y="183" font-family="Arial" font-size="13" fill="#33475b">folder. Only the first time.</text>

  <!-- down -->
  <path d="M806 190 L806 220 L154 220 L154 248" fill="none" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="147,248 154,264 161,248" fill="#9bb0c4"/>

  <!-- ROW 2 -->
  <rect x="30" y="264" width="270" height="110" rx="10" fill="#e7f7f1" stroke="#178a6e" stroke-width="2"/>
  <circle cx="60" cy="292" r="15" fill="#178a6e"/>
  <text x="60" y="298" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="86" y="298" font-family="Arial" font-size="15" font-weight="bold" fill="#0f5e4b">Paste the prompt</text>
  <text x="50" y="329" font-family="Arial" font-size="13" fill="#1a4a3d">Fill in [ORGANIZATION] and</text>
  <text x="50" y="348" font-family="Arial" font-size="13" fill="#1a4a3d">[AREAS], paste the block and</text>
  <text x="50" y="367" font-family="Arial" font-size="13" fill="#1a4a3d">let it create everything.</text>

  <path d="M300 319 L340 319" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="340,312 356,319 340,326" fill="#9bb0c4"/>

  <rect x="356" y="264" width="270" height="110" rx="10" fill="#f3eefb" stroke="#7a4bc0" stroke-width="2"/>
  <circle cx="386" cy="292" r="15" fill="#7a4bc0"/>
  <text x="386" y="298" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="412" y="298" font-family="Arial" font-size="15" font-weight="bold" fill="#4e2a86">Paste into Instructions</text>
  <text x="376" y="329" font-family="Arial" font-size="13" fill="#40305a">Claude will give you a text</text>
  <text x="376" y="348" font-family="Arial" font-size="13" fill="#40305a">with the rules: paste it into</text>
  <text x="376" y="367" font-family="Arial" font-size="13" fill="#40305a">the <tspan font-weight="bold">Instructions</tspan> section.</text>

  <path d="M626 319 L666 319" stroke="#9bb0c4" stroke-width="3"/>
  <polygon points="666,312 682,319 666,326" fill="#9bb0c4"/>

  <rect x="682" y="264" width="248" height="110" rx="10" fill="#e7f7f1" stroke="#178a6e" stroke-width="2"/>
  <circle cx="712" cy="292" r="15" fill="#178a6e"/>
  <text x="712" y="298" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">6</text>
  <text x="738" y="298" font-family="Arial" font-size="15" font-weight="bold" fill="#0f5e4b">Tell it things</text>
  <text x="702" y="329" font-family="Arial" font-size="13" fill="#1a4a3d">Data, emails, screenshots,</text>
  <text x="702" y="348" font-family="Arial" font-size="13" fill="#1a4a3d">documents… it files them.</text>
  <text x="702" y="367" font-family="Arial" font-size="13" font-weight="bold" fill="#1a4a3d">You're up and running.</text>

  <text x="480" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7a8d">Steps 1 to 3 are done only once. Step 6 is the day-to-day.</text>
</svg>
