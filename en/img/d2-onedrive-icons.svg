<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1a2a3a">If the folder is in OneDrive: check the icon</text>
  <text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#8a94a0">Illustrative diagram (not a screenshot)</text>

  <!-- WRONG ROW -->
  <rect x="30" y="72" width="840" height="102" rx="10" fill="#fdecec" stroke="#d5342f" stroke-width="2"/>
  <path d="M 82 148 C 70 148 62 140 62 130 C 62 120 70 113 79 114 C 83 102 95 96 106 100 C 116 104 122 113 121 123 C 130 123 137 129 137 136 C 137 143 131 148 124 148 Z"
        fill="#ffffff" stroke="#7a8794" stroke-width="2.5"/>
  <text x="165" y="108" font-family="Arial" font-size="15" fill="#33475b">MyKnowledge</text>
  <rect x="165" y="120" width="215" height="26" rx="13" fill="#f7d4d3"/>
  <text x="272" y="138" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#8a1a17">Cloud icon = online only</text>
  <text x="410" y="112" font-family="Arial" font-size="15" font-weight="bold" fill="#8a1a17">Claude CANNOT read the files</text>
  <text x="410" y="138" font-family="Arial" font-size="13" fill="#5a2320">What you see are empty placeholders, with no content on disk.</text>
  <circle cx="822" cy="123" r="20" fill="#d5342f"/>
  <path d="M 813 114 L 831 132 M 831 114 L 813 132" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- ACTION -->
  <rect x="230" y="188" width="440" height="42" rx="8" fill="#fff5e8" stroke="#e08a2b" stroke-width="2"/>
  <text x="450" y="215" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#7a4a10">Right-click → “Always keep on this device”</text>
  <path d="M 450 174 L 450 186" stroke="#e08a2b" stroke-width="3"/>
  <path d="M 450 232 L 450 244" stroke="#178a6e" stroke-width="3"/>
  <polygon points="443,244 450,258 457,244" fill="#178a6e"/>

  <!-- RIGHT ROW -->
  <rect x="30" y="258" width="840" height="82" rx="10" fill="#e7f7f1" stroke="#178a6e" stroke-width="2"/>
  <circle cx="100" cy="299" r="21" fill="#178a6e"/>
  <path d="M 90 299 L 97 307 L 111 291" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="165" y="292" font-family="Arial" font-size="15" fill="#1a4a3d">MyKnowledge</text>
  <rect x="165" y="302" width="215" height="26" rx="13" fill="#c7ebdd"/>
  <text x="272" y="320" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#0f5e4b">Green circle = on this PC</text>
  <text x="410" y="294" font-family="Arial" font-size="15" font-weight="bold" fill="#0f5e4b">Done: the files are accessible</text>
  <text x="410" y="320" font-family="Arial" font-size="13" fill="#1a4a3d">Wait until all the icons have changed before you continue.</text>
  <circle cx="822" cy="299" r="20" fill="#178a6e"/>
  <path d="M 812 299 L 819 307 L 833 291" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
