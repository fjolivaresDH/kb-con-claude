<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566">
  <rect x="0" y="0" width="900" height="566" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1a2a3a">What the prompt creates, and what each part is for</text>
  <text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#8a94a0">Illustrative diagram (not a screenshot)</text>

  <rect x="28" y="72" width="430" height="138" rx="8" fill="#f4f7fa"/>
  <rect x="28" y="216" width="430" height="98" rx="8" fill="#fff5e8"/>
  <rect x="28" y="320" width="430" height="76" rx="8" fill="#e7f7f1"/>
  <rect x="28" y="402" width="430" height="130" rx="8" fill="#eef4fb"/>

  <text x="44" y="94" font-family="Courier New" font-size="15" font-weight="bold" fill="#1a2a3a">MyKnowledge/</text>
  <text x="44" y="118" font-family="Courier New" font-size="14" fill="#33475b">├── index.md</text>
  <text x="44" y="140" font-family="Courier New" font-size="14" fill="#33475b">├── log.md</text>
  <text x="44" y="162" font-family="Courier New" font-size="14" fill="#33475b">├── CONVENTIONS.md</text>
  <text x="44" y="184" font-family="Courier New" font-size="14" fill="#33475b">├── CLAUDE.md</text>
  <text x="44" y="206" font-family="Courier New" font-size="14" fill="#33475b">├── _templates/</text>

  <text x="44" y="240" font-family="Courier New" font-size="14" font-weight="bold" fill="#7a4a10">├── _documents/</text>
  <text x="44" y="262" font-family="Courier New" font-size="14" fill="#7a4a10">│   ├── invoices/</text>
  <text x="44" y="284" font-family="Courier New" font-size="14" fill="#7a4a10">│   ├── contracts/</text>
  <text x="44" y="306" font-family="Courier New" font-size="14" fill="#7a4a10">│   └── other/</text>

  <text x="44" y="344" font-family="Courier New" font-size="14" font-weight="bold" fill="#0f5e4b">├── _data/</text>
  <text x="44" y="366" font-family="Courier New" font-size="14" fill="#0f5e4b">│   ├── invoices.json</text>
  <text x="44" y="388" font-family="Courier New" font-size="14" fill="#0f5e4b">│   └── contracts.json</text>

  <text x="44" y="426" font-family="Courier New" font-size="14" font-weight="bold" fill="#254a72">├── clients/</text>
  <text x="44" y="448" font-family="Courier New" font-size="14" fill="#254a72">│   ├── index.md</text>
  <text x="44" y="470" font-family="Courier New" font-size="14" fill="#254a72">│   └── directory.md</text>
  <text x="44" y="492" font-family="Courier New" font-size="14" font-weight="bold" fill="#254a72">└── processes/</text>
  <text x="44" y="514" font-family="Courier New" font-size="14" fill="#254a72">    └── index.md</text>

  <path d="M 458 141 L 492 141" stroke="#9bb0c4" stroke-width="2"/>
  <path d="M 458 265 L 492 265" stroke="#e08a2b" stroke-width="2"/>
  <path d="M 458 358 L 492 358" stroke="#178a6e" stroke-width="2"/>
  <path d="M 458 467 L 492 467" stroke="#3b7dd8" stroke-width="2"/>

  <rect x="492" y="103" width="386" height="76" rx="8" fill="#ffffff" stroke="#9bb0c4" stroke-width="1.5"/>
  <text x="506" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#1a2a3a">The base</text>
  <text x="506" y="145" font-family="Arial" font-size="12.5" fill="#33475b">Index, change log, the full formatting rules</text>
  <text x="506" y="159" font-family="Arial" font-size="12.5" fill="#33475b">(CONVENTIONS.md), your summary of the rules</text>
  <text x="506" y="173" font-family="Arial" font-size="12.5" fill="#33475b">(CLAUDE.md) and the document templates.</text>

  <rect x="492" y="229" width="386" height="72" rx="8" fill="#ffffff" stroke="#e08a2b" stroke-width="1.5"/>
  <text x="506" y="251" font-family="Arial" font-size="14" font-weight="bold" fill="#7a4a10">The inbox</text>
  <text x="506" y="271" font-family="Arial" font-size="12.5" fill="#5c3c0e">Drop the PDFs to be processed here. Only three</text>
  <text x="506" y="288" font-family="Arial" font-size="12.5" fill="#5c3c0e">destinations: invoice? contract? if not, “other”.</text>

  <rect x="492" y="326" width="386" height="64" rx="8" fill="#ffffff" stroke="#178a6e" stroke-width="1.5"/>
  <text x="506" y="348" font-family="Arial" font-size="14" font-weight="bold" fill="#0f5e4b">The queryable data</text>
  <text x="506" y="368" font-family="Arial" font-size="12.5" fill="#1a4a3d">Only if you keep contracts or invoices: in JSON,</text>
  <text x="506" y="385" font-family="Arial" font-size="12.5" fill="#1a4a3d">to filter, sort and add up (“what expires in 6 months”).</text>

  <rect x="492" y="426" width="386" height="80" rx="8" fill="#ffffff" stroke="#3b7dd8" stroke-width="1.5"/>
  <text x="506" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#254a72">Your topic areas</text>
  <text x="506" y="468" font-family="Arial" font-size="12.5" fill="#33475b">One folder per topic, with its index inside.</text>
  <text x="506" y="485" font-family="Arial" font-size="12.5" fill="#33475b">This is where prose knowledge lives: concepts,</text>
  <text x="506" y="502" font-family="Arial" font-size="12.5" fill="#33475b">procedures, decisions and their context.</text>

  <text x="450" y="552" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#6b7a8d">Folders starting with _ are service folders. The full rules live in CONVENTIONS.md; their summary, in “Instructions” (CLAUDE.md).</text>
</svg>
